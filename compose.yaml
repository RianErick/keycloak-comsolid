services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: start-dev --import-realm
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?KEYCLOAK_ADMIN_USERNAME must be set}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set}
      KC_DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER must be set}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      KC_DB_SCHEMA: keycloak
      KC_FEATURES: update-email
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
      KC_HEALTH_ENABLED: true
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: true
    ports:
      - "8080:8080"
    volumes:
      - ./infra/realm-demo.json:/opt/keycloak/data/import/realm-demo.json:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 50s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER must be set}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  flyway:
    image: flyway/flyway:13-alpine
    container_name: setup-keycloak-consolid-flyway
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    command:
      - -url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set}
      - -user=${POSTGRES_USER:?POSTGRES_USER must be set}
      - -password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - -schemas=public,keycloak
      - -defaultSchema=public
      - -connectRetries=60
      - migrate
    volumes:
      - ./backend/src/main/resources/db/migration:/flyway/sql:ro

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: setup-keycloak-consolid-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
